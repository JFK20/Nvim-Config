stages:
    - check
    - build
    - deploy

.frontend-base:
    image: "node:lts"
    cache:
        paths:
            - frontend/tools/node_modules
        key:
            files:
                - frontend/tools/package.json
                - frontend/tools/yarn.lock
        untracked: true
    before_script:
        - cd frontend/tools
        - corepack enable
        - corepack prepare yarn@4.0.0
        - yarn --version

.backend-base:
    image: "python:3.11"
    variables:
        PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    cache:
        paths:
            - .cache/pip
        key:
            files:
                - backend/requirements.txt
        untracked: true
    before_script:
        - export SECRET_KEY='wk(82mk@u!^$9kt-v-=u(y4cl2!ulp7kv0g6qx(n!tc6@ol!r8'
        - export DEBUG='false'
        - export ENV='PROD'
        - export CACHE_ENGINE='dummy'
        - apt-get update && apt-get install gettext -y
        - cd backend

check-frontend:
    extends: .frontend-base
    except:
        - main
        - dev
    only:
        changes:
            - frontend/**/*
    stage: check
    allow_failure: true
    script:
        - yarn
        - npx eslint -c .eslintrc.cjs ../src/js/app/ --fix
        - npm run build

check-backend:
    extends: .backend-base
    except:
        - main
        - dev
    only:
        changes:
            - backend/**/*
    stage: check
    allow_failure: true
    script:
        - pip install -r requirements.txt --no-compile
        - python manage.py migrate
        - django-admin compilemessages
        - python manage.py check

build-frontend:
    extends: .frontend-base
    only:
        - main
        - dev
        - tags
        - merge_requests
    stage: build
    # override cache to prevent caching
    cache: []
    script:
        - yarn
        - npx eslint -c .eslintrc.cjs ../src/js/app/
        - npm run build
    artifacts:
        paths:
            - backend/dashboard/static/*

build-backend:
    extends: .backend-base
    only:
        - main
        - dev
        - tags
        - merge_requests
    stage: build
    # override cache to prevent caching
    cache: []
    script:
        - pip install -r requirements.txt --no-cache-dir
        - django-admin compilemessages
        - python manage.py collectstatic --noinput
        - python manage.py migrate
        - python manage.py check --deploy
    artifacts:
        paths:
            - backend/dashboard/locale/*
            - backend/dashboard/static/*

deploy-dashboard:
    rules:
        - if: '$CI_COMMIT_TAG'
        - if: '$CI_COMMIT_BRANCH == "main"'
        - if: '$CI_COMMIT_BRANCH == "dev"'
        - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME'
    stage: deploy
    image: "docker:latest"
    services:
        - docker:20.10.16-dind
    cache: []
    dependencies:
        - build-frontend
        - build-backend
    before_script:
        - docker login -u "gitlab-ci-token" -p $CI_JOB_TOKEN $CI_REGISTRY
        - |
            if [ -n "$CI_COMMIT_TAG" ]; then
              IMAGE_TAG="${CI_COMMIT_TAG#"v"}"
            elif [ "$CI_COMMIT_REF_NAME" == "main" ]; then
              IMAGE_TAG="latest"
            elif [ "$CI_COMMIT_REF_NAME" == "dev" ]; then
              IMAGE_TAG="dev"
            else
              IMAGE_TAG="b-${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME%%-*}-latest"
            fi
    script:
        - docker build -t $CI_REGISTRY_IMAGE:$IMAGE_TAG .
        - docker push $CI_REGISTRY_IMAGE:$IMAGE_TAG
